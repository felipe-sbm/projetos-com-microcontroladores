; PlatformIO Project Configuration File
[env:esp32dev]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200

build_flags =
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4

lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    bodmer/TFT_eSPI@^2.5.43
    ricmoo/QRCode@^0.0.1
